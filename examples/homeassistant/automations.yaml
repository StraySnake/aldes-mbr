# Sample Home Assistant automations — append to /config/automations.yaml
# (or paste in the Automations editor)
#
# Entity IDs assume the default DEVICE_NAME ("Aldes VMC") -> select.aldes_vmc_mode.
#
# After saving: Developer Tools → YAML → Reload Automations (no full HA restart needed)
#
# Cycle:
#   20:00  → Holiday mode (low speed, quiet at night)
#   08:00  → Daily mode (normal speed)

- id: vmc_evening_holiday
  alias: VMC - Holiday at 8 PM
  description: Switch the VMC to holiday/low mode every evening
  triggers:
    - trigger: time
      at: '20:00:00'
  conditions: []
  actions:
    - action: select.select_option
      target:
        entity_id: select.aldes_vmc_mode
      data:
        # Use the friendly French label exposed by the broker.
        # Other valid options: "Quotidien", "Invités", "Boost", "Programme"
        option: Vacances
  mode: single

- id: vmc_morning_daily
  alias: VMC - Daily at 8 AM
  description: Switch the VMC back to daily mode every morning
  triggers:
    - trigger: time
      at: '08:00:00'
  conditions: []
  actions:
    - action: select.select_option
      target:
        entity_id: select.aldes_vmc_mode
      data:
        option: Quotidien
  mode: single
