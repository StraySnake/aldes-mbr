name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # same as the Docker image
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Compile
        run: python -m py_compile fake_iothub.py tools/aldes_pair.py

      - name: Tests
        run: pytest

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (amd64, not pushed)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: aldes-mqtt-bridge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name bridge -e DEVICE_MAC=AABBCCDDEEFF aldes-mqtt-bridge:ci
          for _ in $(seq 1 20); do
            docker logs bridge 2>&1 | grep -q "listening on" && break
            sleep 1
          done
          docker logs bridge
          docker logs bridge 2>&1 | grep -q "listening on"
          docker stop bridge  # must exit quickly and cleanly on SIGTERM
          test "$(docker inspect -f '{{.State.ExitCode}}' bridge)" = "0"
