name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"  # same as the Docker image
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Compile
        run: python -m py_compile fake_iothub.py tools/aldes_pair.py

      - name: Tests
        run: pytest

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (amd64, not pushed)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: aldes-mqtt-bridge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Starts as non-root, exits cleanly on docker stop
        run: |
          docker run -d --name bridge -e DEVICE_MAC=AABBCCDDEEFF aldes-mqtt-bridge:ci
          for _ in $(seq 1 20); do
            docker logs bridge 2>&1 | grep -q "listening on" && break
            sleep 1
          done
          docker logs bridge
          docker logs bridge 2>&1 | grep -q "listening on"
          test "$(docker exec bridge stat -c %U /proc/1)" = "aldes"
          # no Mosquitto here: the healthcheck must say so (and fail)
          for _ in $(seq 1 10); do
            docker exec bridge python /app/healthcheck.py 2>&1 | grep -q "upstream MQTT not connected" && break
            sleep 1
          done
          docker exec bridge python /app/healthcheck.py 2>&1 | grep -q "upstream MQTT not connected"
          if docker exec bridge python /app/healthcheck.py; then echo "expected unhealthy"; exit 1; fi
          docker stop bridge  # must exit quickly and cleanly on SIGTERM
          test "$(docker inspect -f '{{.State.ExitCode}}' bridge)" = "0"

      - name: Reuses a /data volume created by an older root-only image
        run: |
          mkdir -p data
          # old images ran as root: cert and key end up root-owned, key mode 600
          docker run --rm -v "$PWD/data:/data" -e DEVICE_MAC=AABBCCDDEEFF --user 0 \
            --entrypoint python aldes-mqtt-bridge:ci -c "import fake_iothub as f; f.gen_cert()"
          sudo stat -c '%U %a %n' data/*
          docker run -d --name upgraded -v "$PWD/data:/data" -e DEVICE_MAC=AABBCCDDEEFF aldes-mqtt-bridge:ci
          for _ in $(seq 1 20); do
            docker logs upgraded 2>&1 | grep -q "listening on" && break
            sleep 1
          done
          docker logs upgraded
          docker logs upgraded 2>&1 | grep -q "listening on"
          test "$(docker exec upgraded stat -c %U /proc/1)" = "aldes"
          docker rm -f upgraded

      - name: Healthy once Mosquitto is reachable
        run: |
          docker run -d --name mosquitto --network host eclipse-mosquitto:2 mosquitto -c /mosquitto-no-auth.conf
          docker run -d --name healthy --network host -e DEVICE_MAC=AABBCCDDEEFF -e LISTEN_PORT=18883 \
            aldes-mqtt-bridge:ci
          for _ in $(seq 1 30); do
            docker exec healthy python /app/healthcheck.py && break
            sleep 1
          done
          docker logs healthy
          docker exec healthy python /app/healthcheck.py
          docker rm -f healthy mosquitto
